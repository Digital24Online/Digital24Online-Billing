name: Test Digital24 Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create Android project
        run: |
          flutter create \
            --platforms=android \
            --project-name=digital24online \
            --org=com.digital24online \
            test_app

      - name: Replace main.dart
        working-directory: test_app
        run: |
          cat > lib/main.dart <<'EOF'
          import 'package:flutter/material.dart';

          void main() {
            runApp(
              const MaterialApp(
                debugShowCheckedModeBanner: false,
                home: Scaffold(
                  body: Center(
                    child: Text(
                      'Digital 24 Online Billing',
                      style: TextStyle(fontSize: 22),
                    ),
                  ),
                ),
              ),
            );
          }
          EOF

      - name: Configure Android
        working-directory: test_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()

          text = re.sub(
              r'id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+"[^"]+"',
              'id("org.jetbrains.kotlin.android") version "2.3.21"',
              text
          )

          settings.write_text(text)

          app = Path("android/app/build.gradle.kts")
          text = app.read_text()

          text = re.sub(
              r'namespace\s*=\s*"[^"]+"',
              'namespace = "com.digital24online"',
              text,
              count=1
          )

          text = re.sub(
              r'applicationId\s*=\s*"[^"]+"',
              'applicationId = "com.digital24online"',
              text,
              count=1
          )

          text = text.replace(
              'JavaVersion.VERSION_11',
              'JavaVersion.VERSION_17'
          )

          app.write_text(text)
          PY

      - name: Build APK
        working-directory: test_app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Digital24-Android-Test
          path: test_app/build/app/outputs/flutter-apk/app-debug.apk
