name: Test-14 Release Startup Without Firebase

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create clean Android project
        run: |
          flutter create \
            --platforms=android \
            --project-name=digital24startup14 \
            --org=com.digital24online \
            build_test

      - name: Copy current project files
        run: |
          rm -rf build_test/lib
          cp -R lib build_test/lib

          cp pubspec.yaml build_test/pubspec.yaml

          if [ -d assets ]; then
            cp -R assets build_test/assets
          fi

          if [ -f android/app/google-services.json ]; then
            mkdir -p build_test/android/app
            cp android/app/google-services.json \
              build_test/android/app/google-services.json
          fi

      - name: Configure Kotlin and Java
        working-directory: build_test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # -------------------------------------------------
          # Kotlin Gradle Plugin
          # -------------------------------------------------
          p = Path("android/settings.gradle.kts")
          text = p.read_text()

          text = re.sub(
              r'id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+"[^"]+"\s+apply\s+false',
              'id("org.jetbrains.kotlin.android") version "2.3.21" apply false',
              text
          )

          p.write_text(text)

          # -------------------------------------------------
          # Android app Gradle
          # -------------------------------------------------
          p = Path("android/app/build.gradle.kts")
          text = p.read_text()

          # Force Java 17
          text = re.sub(
              r'sourceCompatibility\s*=\s*JavaVersion\.VERSION_\d+',
              'sourceCompatibility = JavaVersion.VERSION_17',
              text
          )

          text = re.sub(
              r'targetCompatibility\s*=\s*JavaVersion\.VERSION_\d+',
              'targetCompatibility = JavaVersion.VERSION_17',
              text
          )

          # Remove old Kotlin jvmTarget configuration
          text = re.sub(
              r'\n\s*kotlinOptions\s*\{.*?\n\s*\}',
              '',
              text,
              flags=re.DOTALL
          )

          # Remove an existing Kotlin compilerOptions block
          text = re.sub(
              r'\n\s*kotlin\s*\{\s*compilerOptions\s*\{.*?\n\s*\}\s*\}',
              '',
              text,
              flags=re.DOTALL
          )

          # Add modern Kotlin JVM 17 configuration
          marker = 'android {'

          replacement = '''android {
              kotlin {
                  compilerOptions {
                      jvmTarget.set(
                          org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                      )
                  }
              }
          '''

          text = text.replace(marker, replacement, 1)

          p.write_text(text)
          PY

      - name: Verify Android configuration
        working-directory: build_test
        run: |
          echo "===== Kotlin Plugin ====="
          grep -n "org.jetbrains.kotlin.android" android/settings.gradle.kts

          echo "===== Java Source Target ====="
          grep -n "sourceCompatibility" android/app/build.gradle.kts

          echo "===== Java Target ====="
          grep -n "targetCompatibility" android/app/build.gradle.kts

          echo "===== Kotlin JVM Target ====="
          grep -n "JvmTarget.JVM_17" android/app/build.gradle.kts

      - name: Create Test-14 Entry Point
        working-directory: build_test
        run: |
          cat > lib/startup_test_14.dart <<'DART'
          import 'package:flutter/material.dart';

          import 'main.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();

            runApp(
              const Digital24OnlineBilling(
                firebaseReady: false,
              ),
            );
          }
          DART

          test -s lib/startup_test_14.dart

      - name: Get dependencies
        working-directory: build_test
        run: |
          flutter pub get

      - name: Analyze Test-14 entry point
        working-directory: build_test
        run: |
          flutter analyze lib/startup_test_14.dart

      - name: Build Test-14 Release APK
        working-directory: build_test
        run: |
          flutter build apk \
            --release \
            --target=lib/startup_test_14.dart

      - name: Verify Release APK exists
        run: |
          test -s build_test/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Test-14 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Digital24Online-Test14-Release-APK
          path: build_test/build/app/outputs/flutter-apk/app-release.apk
