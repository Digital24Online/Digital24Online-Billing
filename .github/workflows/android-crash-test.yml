name: Android Crash Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create Android project
        run: |
          flutter create \
            --platforms=android \
            --project-name=digital24online \
            --org=com.digital24online \
            test_app

      - name: Configure Kotlin and Java
        working-directory: test_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()

          text = re.sub(
              r'id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+"[^"]+"',
              'id("org.jetbrains.kotlin.android") version "2.3.21"',
              text
          )

          settings.write_text(text)

          app = Path("android/app/build.gradle.kts")
          text = app.read_text()

          text = text.replace(
              'JavaVersion.VERSION_11',
              'JavaVersion.VERSION_17'
          )

          text = re.sub(
              r'kotlinOptions\s*\{.*?\}',
              '',
              text,
              flags=re.DOTALL
          )

          if 'jvmToolchain(17)' not in text:
              text = text.replace(
                  'android {',
                  'kotlin {\n    jvmToolchain(17)\n}\n\nandroid {',
                  1
              )

          app.write_text(text)
          PY

      - name: Copy project files
        run: |
          rm -rf test_app/lib
          cp -R lib test_app/lib
          cp pubspec.yaml test_app/pubspec.yaml
          cp -R assets test_app/assets

      - name: Get dependencies
        working-directory: test_app
        run: flutter pub get

      - name: Build APK
        working-directory: test_app
        run: flutter build apk --debug

      - name: Start Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r test_app/build/app/outputs/flutter-apk/app-debug.apk
            adb shell am force-stop com.digital24online
            adb logcat -c
            adb shell monkey -p com.digital24online 1
            sleep 15
            adb logcat -d > crash-log.txt
            cat crash-log.txt

      - name: Upload crash log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Crash-Log
          path: crash-log.txt
