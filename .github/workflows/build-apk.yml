name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create fresh Android Flutter project
        run: |
          flutter create -t app --platforms=android --project-name=digital24onlinebilling build_app

      - name: Copy app code
        run: |
          rm -rf build_app/lib
          cp -R lib build_app/lib
          cp pubspec.yaml build_app/pubspec.yaml

      - name: Get dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Check Bill Date Code
        working-directory: build_app
        run: |
          echo "Checking main.dart..."
          grep -n "৭ তারিখ" lib/main.dart
          grep -n "১৪ তারিখ" lib/main.dart
          grep -n "২১ তারিখ" lib/main.dart

      - name: Build APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Digital24Online-Billing-APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
