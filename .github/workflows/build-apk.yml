name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Check Bill Date Code
        run: |
          echo "Checking main.dart..."
          grep -n "৭ তারিখ" lib/main.dart
          grep -n "১৪ তারিখ" lib/main.dart
          grep -n "২১ তারিখ" lib/main.dart

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Digital24Online-Billing-APK
          path: build/app/outputs/flutter-apk/app-release.apk
