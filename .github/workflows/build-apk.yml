name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create Android project
        run: |
          flutter create \
            --platforms=android \
            --project-name=digital24online \
            --org=com.digital24online \
            build_app

      - name: Configure Android
        working-directory: build_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # settings.gradle.kts
          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()

          text = re.sub(
              r'id"org\.jetbrains\.kotlin\.android"\s+version\s+"[^"]+"',
              'id("org.jetbrains.kotlin.android") version "2.3.21"',
              text
          )

          if "com.google.gms.google-services" not in text:
              text = text.replace(
                  "plugins {",
                  'plugins {\n'
                  '    id("com.google.gms.google-services") '
                  'version "4.4.2" apply false',
                  1
              )

          settings.write_text(text)

          # app/build.gradle.kts
          app = Path("android/app/build.gradle.kts")
          text = app.read_text()

          text
