name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create Android project
        run: |
          flutter create \
            --platforms=android \
            --project-name=digital24online \
            --org=com.digital24online \
            build_app

      - name: Copy app files
        run: |
          rm -rf build_app/lib
          cp -R lib build_app/lib
          cp pubspec.yaml build_app/pubspec.yaml
          cp -R assets build_app/assets

      - name: Set app name
        working-directory: build_app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()
          text = text.replace(
              'android:label="digital24online"',
              'android:label="Digital 24 Online"'
          )
          p.write_text(text)
          PY

      - name: Get dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p build_app/android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > build_app/android/keystore/digital24.jks
          test -s build_app/android/keystore/digital24.jks

      - name: Configure signing
        working-directory: build_app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          text = p.read_text()

          text = text.replace(
              'android {',
              '''android {
              signingConfigs {
                  create("release") {
                      storeFile = file("../keystore/digital24.jks")
                      storePassword = System.getenv("KEYSTORE_PASSWORD")!!
                      keyAlias = "digital24"
                      keyPassword = System.getenv("KEYSTORE_PASSWORD")!!
                  }
              }'''
          )

          text = text.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")'
          )

          p.write_text(text)
          PY

      - name: Build APK
        working-directory: build_app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Digital24Online-APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
