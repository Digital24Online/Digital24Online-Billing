name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create Flutter Android project
        run: |
          flutter create \
            --platforms=android \
            --project-name=digital24online \
            --org=com.digital24online \
            build_app

      - name: Copy app code
        run: |
          rm -rf build_app/lib
          cp -R lib build_app/lib
          cp pubspec.yaml build_app/pubspec.yaml

      - name: Set app name
        working-directory: build_app
        run: |
          sed -i "s/android:label=\"digital24online\"/android:label=\"Digital 24 Online\"/" android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Create signing key
        run: |
          mkdir -p build_app/android/keystore

          keytool -genkeypair \
            -v \
            -keystore build_app/android/keystore/digital24.jks \
            -storepass digital24online123 \
            -keypass digital24online123 \
            -alias digital24 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Digital24Online, OU=Billing, O=Digital24Online, L=Rajshahi, ST=Rajshahi, C=BD"

      - name: Configure signing
        working-directory: build_app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path("android/app/build.gradle.kts")
          text = file.read_text()

          text = text.replace(
              'android {',
              '''android {
              signingConfigs {
                  create("release") {
                      storeFile = file("../keystore/digital24.jks")
                      storePassword = "digital24online123"
                      keyAlias = "digital24"
                      keyPassword = "digital24online123"
                  }
              }'''
          )

          text = text.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")'
          )

          file.write_text(text)
          PY

      - name: Build APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Digital24Online-Billing-APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
