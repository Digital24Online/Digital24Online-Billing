name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create Android project
        run: |
          set -e

          flutter create \
            --platforms=android \
            --project-name=digital24online \
            --org=com.digital24online \
            build_app

      - name: Copy app files
        run: |
          set -e

          rm -rf build_app/lib
          cp -R lib build_app/lib

          cp pubspec.yaml build_app/pubspec.yaml

          rm -rf build_app/assets
          cp -R assets build_app/assets

      - name: Copy Firebase configuration
        run: |
          set -e

          mkdir -p build_app/android/app

          cp \
            android/app/google-services.json \
            build_app/android/app/google-services.json

          test -s build_app/android/app/google-services.json

      - name: Restore release signing key
        working-directory: build_app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"

          mkdir -p android/keystore

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > android/keystore/digital24.jks

          test -s android/keystore/digital24.jks

          echo "===== CHECKING RELEASE KEYSTORE ====="

          KEY_ALIAS="$(
            keytool -list \
              -keystore android/keystore/digital24.jks \
              -storepass "$KEYSTORE_PASSWORD" \
              -v \
              | awk -F': ' '/Alias name:/ {print $2; exit}'
          )"

          test -n "$KEY_ALIAS"

          if [ -n "${KEY_PASSWORD:-}" ]; then
            FINAL_KEY_PASSWORD="$KEY_PASSWORD"
          else
            FINAL_KEY_PASSWORD="$KEYSTORE_PASSWORD"
          fi

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$FINAL_KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore/digital24.jks
          EOF

          test -s android/key.properties

          echo "Release keystore restored successfully."
          echo "Release key alias detected: $KEY_ALIAS"

          echo "===== RELEASE KEY CERTIFICATE ====="

          keytool -list \
            -keystore android/keystore/digital24.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -v \
            | grep -E \
              'Alias name:|Owner:|Issuer:|Serial number:|Valid from:|SHA256:'

            - name: Configure Android application and release signing
        working-directory: build_app
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          # --------------------------------------------------
          # settings.gradle.kts
          # --------------------------------------------------

          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()

          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false',
                  1
              )

          settings.write_text(text)

          # --------------------------------------------------
          # app/build.gradle.kts
          # --------------------------------------------------

          app = Path("android/app/build.gradle.kts")
          text = app.read_text()

          # Application ID
          text = re.sub(
              r'namespace\s*=\s*"[^"]+"',
              'namespace = "com.digital24online"',
              text,
              count=1
          )

          text = re.sub(
              r'applicationId\s*=\s*"[^"]+"',
              'applicationId = "com.digital24online"',
              text,
              count=1
          )

          # --------------------------------------------------
          # Google Services plugin
          # --------------------------------------------------

          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services")',
                  1
              )

          # --------------------------------------------------
          # Java 17
          # --------------------------------------------------

          text = text.replace(
              "JavaVersion.VERSION_11",
              "JavaVersion.VERSION_17"
          )

          text = re.sub(
              r'\n\s*kotlinOptions\s*\{.*?\n\s*\}',
              '',
              text,
              flags=re.DOTALL
          )

          if "jvmToolchain(17)" not in text:
              text = text.replace(
                  "android {",
                  "kotlin {\n    jvmToolchain(17)\n}\n\nandroid {",
                  1
              )

          # --------------------------------------------------
          # key.properties imports
          # --------------------------------------------------

          if "import java.util.Properties" not in text:
              text = (
                  "import java.util.Properties\n"
                  "import java.io.FileInputStream\n\n"
                  + text
              )

          # --------------------------------------------------
          # Load key.properties
          # --------------------------------------------------

          if "val keystoreProperties = Properties()" not in text:
              key_block = """
          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          """

              text = text.replace(
                  "android {",
                  key_block + "android {",
                  1
              )

          # --------------------------------------------------
          # Remove any existing signingConfig line.
          # This prevents debug signing from remaining active.
          # --------------------------------------------------

          text = re.sub(
              r'^[ \t]*signingConfig\s*=.*\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          # --------------------------------------------------
          # Create Digital 24 release signing configuration.
          # --------------------------------------------------

          if 'create("release")' not in text:
              signing_block = """
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties.getProperty("keyAlias")
                      keyPassword = keystoreProperties.getProperty("keyPassword")
                      storeFile = keystoreProperties.getProperty("storeFile")?.let { file(it) }
                      storePassword = keystoreProperties.getProperty("storePassword")
                  }
              }

          """

              text = text.replace(
                  "    buildTypes {",
                  signing_block + "    buildTypes {",
                  1
              )

          # --------------------------------------------------
          # Force release APK to use the restored release key.
          # No brace-counting is used here.
          # --------------------------------------------------

          release_marker = "        release {"

          if release_marker not in text:
              release_marker = "    release {"

          if release_marker not in text:
              raise RuntimeError(
                  "Could not locate the generated release buildType."
              )

          signing_line = (
              '            signingConfig = '
              'signingConfigs.getByName("release")'
          )

          if signing_line not in text:
              text = text.replace(
                  release_marker,
                  release_marker + "\n" + signing_line,
                  1
              )

          app.write_text(text)

          print("===== ANDROID SIGNING CONFIGURATION CREATED =====")
          print("Application ID: com.digital24online")
          print("Namespace: com.digital24online")
          print("Signing config: release")
          PY

          echo "===== VERIFYING GRADLE SIGNING CONFIG ====="

          grep -n \
            'applicationId = "com.digital24online"' \
            android/app/build.gradle.kts

          grep -n \
            'namespace = "com.digital24online"' \
            android/app/build.gradle.kts

          grep -n \
            'create("release")' \
            android/app/build.gradle.kts

          grep -n \
            'signingConfig = signingConfigs.getByName("release")' \
            android/app/build.gradle.kts

          if grep -n \
            'signingConfig = signingConfigs.getByName("debug")' \
            android/app/build.gradle.kts; then
            echo "ERROR: Debug signing configuration detected."
            exit 1
          fi

          echo "===== RELEASE SIGNING CONFIG VERIFIED ====="

      - name: Fix MainActivity package
        working-directory: build_app
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("android/app/src/main/kotlin")
          candidates = list(root.rglob("MainActivity.kt"))

          if len(candidates) != 1:
              raise RuntimeError(
                  f"Expected exactly one MainActivity.kt, found {len(candidates)}: {candidates}"
              )

          source = candidates[0]
          text = source.read_text()

          text = re.sub(
              r'^package\s+[^\r\n]+',
              'package com.digital24online',
              text,
              count=1,
              flags=re.MULTILINE
          )

          target_dir = root / "com" / "digital24online"
          target_dir.mkdir(parents=True, exist_ok=True)

          target = target_dir / "MainActivity.kt"
          target.write_text(text)

          if source.resolve() != target.resolve():
              source.unlink()

              current = source.parent

              while current != root and current.exists():
                  try:
                      current.rmdir()
                  except OSError:
                      break

                  current = current.parent

          PY

          test -f "android/app/src/main/kotlin/com/digital24online/MainActivity.kt"

          grep -q '^package com.digital24online$' \
            "android/app/src/main/kotlin/com/digital24online/MainActivity.kt"

          echo "===== MAIN ACTIVITY VERIFIED ====="

          cat \
            "android/app/src/main/kotlin/com/digital24online/MainActivity.kt"

      - name: Set app name
        working-directory: build_app
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          text = text.replace(
              'android:label="digital24online"',
              'android:label="Digital 24 Online"'
          )

          manifest.write_text(text)
          PY

      - name: Get dependencies
        working-directory: build_app
        run: |
          set -e
          flutter pub get

      - name: Generate App Icon
        working-directory: build_app
        run: |
          set -e
          dart run flutter_launcher_icons

      - name: Verify Firebase configuration
        working-directory: build_app
        run: |
          set -e

          test -s android/app/google-services.json

          grep -q \
            '"package_name": "com.digital24online"' \
            android/app/google-services.json

          echo "Firebase package verified."

      - name: Verify Android configuration
        working-directory: build_app
        run: |
          set -e

          echo "===== APPLICATION ID ====="

          grep -q \
            'applicationId = "com.digital24online"' \
            android/app/build.gradle.kts

          echo "===== NAMESPACE ====="

          grep -q \
            'namespace = "com.digital24online"' \
            android/app/build.gradle.kts

          echo "===== RELEASE SIGNING ====="

          grep -q \
            'create("digital24Release")' \
            android/app/build.gradle.kts

          grep -q \
            'signingConfig = signingConfigs.getByName("digital24Release")' \
            android/app/build.gradle.kts

          echo "===== MAIN ACTIVITY ====="

          test -f \
            android/app/src/main/kotlin/com/digital24online/MainActivity.kt

          grep -q \
            '^package com.digital24online$' \
            android/app/src/main/kotlin/com/digital24online/MainActivity.kt

          echo "===== OLD MAIN ACTIVITY CHECK ====="

          if find \
            android/app/src/main/kotlin/com/digital24online/digital24online \
            -name MainActivity.kt \
            -print \
            -quit \
            | grep -q .; then

            echo "ERROR: Old MainActivity package still exists."
            exit 1
          fi

          echo "===== ANDROID CONFIGURATION VERIFIED ====="

      - name: Build release APK
        working-directory: build_app
        run: |
          set -e

          flutter clean

          flutter pub get

          # Always generate an update-safe versionCode.
          # The previously installed app used versionCode 46.
          # GitHub run number keeps future builds increasing.
          BUILD_NUMBER=$((1000 + ${{ github.run_number }}))

          echo "===== BUILD VERSION ====="
          echo "versionName: 1.0.0"
          echo "versionCode: $BUILD_NUMBER"

          flutter build apk \
            --release \
            --build-number "$BUILD_NUMBER" \
            --build-name 1.0.0

      - name: Verify APK
        working-directory: build_app
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "===== APK FILE ====="

          ls -lh "$APK"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls \
            "$ANDROID_HOME/build-tools" \
            | sort -V \
            | tail -1)"

          AAPT="$BUILD_TOOLS/aapt"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          echo "===== APK PACKAGE ====="

          "$AAPT" dump badging "$APK" \
            | grep -E \
            "package:|launchable-activity:"

          echo "===== APK VERSION VERIFICATION ====="

          EXPECTED_VERSION_CODE=$((1000 + ${{ github.run_number }}))

          ACTUAL_VERSION_CODE="$(
            "$AAPT" dump badging "$APK" \
              | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p"
          )"

          echo "Expected versionCode: $EXPECTED_VERSION_CODE"
          echo "Actual versionCode:   $ACTUAL_VERSION_CODE"

          test "$ACTUAL_VERSION_CODE" = "$EXPECTED_VERSION_CODE"

          echo "===== APK SIGNATURE VERIFICATION ====="

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

          echo "===== CHECKING ACTUAL APK CERTIFICATE ====="

          EXPECTED_SHA256="1C:D4:4E:20:9F:79:35:C0:82:C6:E2:C6:EA:2A:B0:4D:B8:D7:5D:BD:39:FD:76:86:63:05:44:0F:33:FC:13:44"

          ACTUAL_SHA256="$(
            "$APKSIGNER" verify \
              --print-certs \
              "$APK" 2>&1 \
              | sed -n \
                's/.*Signer #1 certificate SHA-256 digest: //p' \
              | head -n 1 \
              | tr '[:lower:]' '[:upper:]'
          )"

          echo "Expected SHA-256:"
          echo "$EXPECTED_SHA256"

          echo "Actual SHA-256:"
          echo "$ACTUAL_SHA256"

          test -n "$ACTUAL_SHA256"

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo ""
            echo "ERROR: APK CERTIFICATE DOES NOT MATCH"
            echo "EXPECTED DIGITAL 24 RELEASE CERTIFICATE."
            echo ""
            echo "The APK will NOT be uploaded."
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "DIGITAL 24 RELEASE CERTIFICATE VERIFIED"
          echo "=============================================="

          echo "APK is correctly release-signed."
          echo "VersionCode is correct."
          echo "APK verification completed successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Digital24Online-APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
