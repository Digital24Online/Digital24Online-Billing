name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create Android project
        run: |
          set -e

          flutter create \
            --platforms=android \
            --project-name=digital24online \
            --org=com.digital24online \
            build_app

      - name: Copy app files
        run: |
          set -e

          rm -rf build_app/lib
          cp -R lib build_app/lib

          cp pubspec.yaml build_app/pubspec.yaml

          rm -rf build_app/assets
          cp -R assets build_app/assets

      - name: Copy Firebase configuration
        run: |
          set -e

          mkdir -p build_app/android/app

          cp \
            android/app/google-services.json \
            build_app/android/app/google-services.json

          test -s build_app/android/app/google-services.json

      - name: Restore release signing key
        working-directory: build_app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"

          mkdir -p android/keystore

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > android/keystore/digital24.jks

          test -s android/keystore/digital24.jks

          echo "===== CHECKING RELEASE KEYSTORE ====="

          KEY_ALIAS="$(
            keytool -list \
              -keystore android/keystore/digital24.jks \
              -storepass "$KEYSTORE_PASSWORD" \
              -v \
              | awk -F': ' '/Alias name:/ {print $2; exit}'
          )"

          test -n "$KEY_ALIAS"

          if [ -n "${KEY_PASSWORD:-}" ]; then
            FINAL_KEY_PASSWORD="$KEY_PASSWORD"
          else
            FINAL_KEY_PASSWORD="$KEYSTORE_PASSWORD"
          fi

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$FINAL_KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore/digital24.jks
          EOF

          test -s android/key.properties

          echo "Release keystore restored successfully."
          echo "Release key alias detected."

      - name: Configure Android application and release signing
        working-directory: build_app
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()

          # Add Google Services plugin to settings.gradle.kts.
          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false',
                  1
              )

          settings.write_text(text)

          app = Path("android/app/build.gradle.kts")
          text = app.read_text()

          # --------------------------------------------------
          # Application ID / namespace
          # --------------------------------------------------

          text = re.sub(
              r'namespace\s*=\s*"[^"]+"',
              'namespace = "com.digital24online"',
              text,
              count=1
          )

          text = re.sub(
              r'applicationId\s*=\s*"[^"]+"',
              'applicationId = "com.digital24online"',
              text,
              count=1
          )

          # --------------------------------------------------
          # Google Services plugin
          # --------------------------------------------------

          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services")',
                  1
              )

          # --------------------------------------------------
          # Java 17
          # --------------------------------------------------

          text = text.replace(
              "JavaVersion.VERSION_11",
              "JavaVersion.VERSION_17"
          )

          # Remove generated kotlinOptions block if present.
          text = re.sub(
              r'\n\s*kotlinOptions\s*\{.*?\n\s*\}',
              '',
              text,
              flags=re.DOTALL
          )

          # Add Kotlin JVM toolchain.
          if "jvmToolchain(17)" not in text:
              text = text.replace(
                  "android {",
                  "kotlin {\n    jvmToolchain(17)\n}\n\nandroid {",
                  1
              )

          # --------------------------------------------------
          # key.properties imports
          # --------------------------------------------------

          if "import java.util.Properties" not in text:
              text = (
                  "import java.util.Properties\n"
                  "import java.io.FileInputStream\n\n"
                  + text
              )

          # --------------------------------------------------
          # Load key.properties
          # --------------------------------------------------

          if "val keystoreProperties = Properties()" not in text:
              key_block = """
          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          """

              text = text.replace(
                  "android {",
                  key_block + "android {",
                  1
              )

          # --------------------------------------------------
          # Release signing configuration
          # --------------------------------------------------

          if 'create("release")' not in text:
              signing_block = """
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties.getProperty("keyAlias")
                      keyPassword = keystoreProperties.getProperty("keyPassword")
                      storeFile = keystoreProperties.getProperty("storeFile")?.let { file(it) }
                      storePassword = keystoreProperties.getProperty("storePassword")
                  }
              }

          """

              text = text.replace(
                  "    buildTypes {",
                  signing_block + "    buildTypes {",
                  1
              )

          # --------------------------------------------------
          # Force release APK to use release keystore
          # --------------------------------------------------

          if 'signingConfig = signingConfigs.getByName("release")' not in text:
              release_pattern = re.compile(
                  r'(buildTypes\s*\{\s*release\s*\{)'
              )

              text, count = release_pattern.subn(
                  r'\1\n            signingConfig = signingConfigs.getByName("release")',
                  text,
                  count=1
              )

              if count != 1:
                  raise RuntimeError(
                      "Could not locate the generated release buildType."
                  )

          app.write_text(text)

          print("===== ANDROID SIGNING CONFIGURATION CREATED =====")
          print("Application ID: com.digital24online")
          print("Namespace: com.digital24online")
          PY

          echo "===== VERIFYING GRADLE SIGNING CONFIG ====="

          grep -n \
            'applicationId = "com.digital24online"' \
            android/app/build.gradle.kts

          grep -n \
            'namespace = "com.digital24online"' \
            android/app/build.gradle.kts

          grep -n \
            'create("release")' \
            android/app/build.gradle.kts

          grep -n \
            'signingConfig = signingConfigs.getByName("release")' \
            android/app/build.gradle.kts

      - name: Fix MainActivity package
        working-directory: build_app
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("android/app/src/main/kotlin")

          candidates = list(root.rglob("MainActivity.kt"))

          if len(candidates) != 1:
              raise RuntimeError(
                  f"Expected exactly one MainActivity.kt, found {len(candidates)}: {candidates}"
              )

          source = candidates[0]
          text = source.read_text()

          text = re.sub(
              r'^package\s+[^\r\n]+',
              'package com.digital24online',
              text,
              count=1,
              flags=re.MULTILINE
          )

          target_dir = root / "com" / "digital24online"
          target_dir.mkdir(parents=True, exist_ok=True)

          target = target_dir / "MainActivity.kt"
          target.write_text(text)

          if source.resolve() != target.resolve():
              source.unlink()

              current = source.parent

              while current != root and current.exists():
                  try:
                      current.rmdir()
                  except OSError:
                      break
                  current = current.parent

          test -f "$target"

          grep -q \
            '^package com.digital24online$' \
            "$target"

          echo "===== MAIN ACTIVITY VERIFIED ====="
          cat "$target"
          PY

      - name: Set app name
        working-directory: build_app
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          text = text.replace(
              'android:label="digital24online"',
              'android:label="Digital 24 Online"'
          )

          manifest.write_text(text)
          PY

      - name: Get dependencies
        working-directory: build_app
        run: |
          set -e
          flutter pub get

      - name: Generate App Icon
        working-directory: build_app
        run: |
          set -e
          dart run flutter_launcher_icons

      - name: Verify Firebase configuration
        working-directory: build_app
        run: |
          set -e

          test -s android/app/google-services.json

          grep -q \
            '"package_name": "com.digital24online"' \
            android/app/google-services.json

          echo "Firebase package verified."

      - name: Verify Android configuration
        working-directory: build_app
        run: |
          set -e

          echo "===== APPLICATION ID ====="

          grep -q \
            'applicationId = "com.digital24online"' \
            android/app/build.gradle.kts

          echo "===== NAMESPACE ====="

          grep -q \
            'namespace = "com.digital24online"' \
            android/app/build.gradle.kts

          echo "===== RELEASE SIGNING ====="

          grep -q \
            'create("release")' \
            android/app/build.gradle.kts

          grep -q \
            'signingConfig = signingConfigs.getByName("release")' \
            android/app/build.gradle.kts

          echo "===== MAIN ACTIVITY ====="

          test -f \
            android/app/src/main/kotlin/com/digital24online/MainActivity.kt

          grep -q \
            '^package com.digital24online$' \
            android/app/src/main/kotlin/com/digital24online/MainActivity.kt

          echo "===== OLD MAIN ACTIVITY CHECK ====="

          if find \
            android/app/src/main/kotlin/com/digital24online/digital24online \
            -name MainActivity.kt \
            -print \
            -quit \
            | grep -q .; then

            echo "ERROR: Old MainActivity package still exists."
            exit 1
          fi

          echo "===== ANDROID CONFIGURATION VERIFIED ====="

      - name: Build release APK
        working-directory: build_app
        run: |
          set -e

          flutter clean

          flutter pub get

          # The previously installed working APK was version +3.
          # Build this release as version +4 so Android accepts it as an update.
          flutter build apk \
            --release \
            --build-number 4 \
            --build-name 1.0.0

      - name: Verify APK
        working-directory: build_app
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "===== APK FILE ====="
          ls -lh "$APK"

          AAPT="$ANDROID_HOME/build-tools/$(ls \
            "$ANDROID_HOME/build-tools" \
            | sort -V \
            | tail -1)/aapt"

          echo "===== APK PACKAGE ====="

          "$AAPT" dump badging "$APK" \
            | grep -E \
            "package:|launchable-activity:"

          echo "===== APK VERSION ====="

          "$AAPT" dump badging "$APK" \
            | grep "package:" \
            | grep -q \
            "versionCode='4'"

          echo "===== APK SIGNATURE ====="

          APKSIGNER="$ANDROID_HOME/build-tools/$(ls \
            "$ANDROID_HOME/build-tools" \
            | sort -V \
            | tail -1)/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          echo "===== APK VERIFICATION COMPLETE ====="

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Digital24Online-APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
