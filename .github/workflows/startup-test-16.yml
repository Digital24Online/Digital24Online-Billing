name: Test-16 Firebase Release With Launcher Icon

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create clean Android project
        run: |
          flutter create \
            --platforms=android \
            --project-name=digital24startup16 \
            --org=com.digital24online \
            build_test

      - name: Copy current project files
        run: |
          rm -rf build_test/lib
          cp -R lib build_test/lib

          cp pubspec.yaml build_test/pubspec.yaml

          if [ -d assets ]; then
            cp -R assets build_test/assets
          fi

          if [ -f android/app/google-services.json ]; then
            mkdir -p build_test/android/app
            cp android/app/google-services.json \
              build_test/android/app/google-services.json
          else
            echo "ERROR: google-services.json not found"
            exit 1
          fi

      - name: Force correct Android package name
        working-directory: build_test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          text = p.read_text()

          text = re.sub(
              r'namespace\s*=\s*"[^"]+"',
              'namespace = "com.digital24online"',
              text
          )

          text = re.sub(
              r'applicationId\s*=\s*"[^"]+"',
              'applicationId = "com.digital24online"',
              text
          )

          p.write_text(text)

          print("Android package forced to:")
          print("com.digital24online")
          PY

      - name: Configure Kotlin and Java
        working-directory: build_test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/settings.gradle.kts")
          text = p.read_text()

          text = re.sub(
              r'id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+"[^"]+"\s+apply\s+false',
              'id("org.jetbrains.kotlin.android") version "2.3.21" apply false',
              text
          )

          if 'com.google.gms.google-services' not in text:
              text = text.replace(
                  'plugins {',
                  '''plugins {
              id("com.google.gms.google-services") version "4.4.4" apply false
              ''',
                  1
              )

          p.write_text(text)

          p = Path("android/app/build.gradle.kts")
          text = p.read_text()

          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(
                  'plugins {',
                  '''plugins {
              id("com.google.gms.google-services")
              ''',
                  1
              )

          text = re.sub(
              r'sourceCompatibility\s*=\s*JavaVersion\.VERSION_\d+',
              'sourceCompatibility = JavaVersion.VERSION_17',
              text
          )

          text = re.sub(
              r'targetCompatibility\s*=\s*JavaVersion\.VERSION_\d+',
              'targetCompatibility = JavaVersion.VERSION_17',
              text
          )

          text = re.sub(
              r'\n\s*kotlinOptions\s*\{.*?\n\s*\}',
              '',
              text,
              flags=re.DOTALL
          )

          text = re.sub(
              r'\n\s*kotlin\s*\{\s*compilerOptions\s*\{.*?\n\s*\}\s*\}',
              '',
              text,
              flags=re.DOTALL
          )

          marker = 'android {'

          replacement = '''android {
              kotlin {
                  compilerOptions {
                      jvmTarget.set(
                          org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                      )
                  }
              }
          '''

          text = text.replace(marker, replacement, 1)

          p.write_text(text)
          PY

      - name: Verify Android package
        working-directory: build_test
        run: |
          echo "===== Package ====="
          grep -n "namespace" android/app/build.gradle.kts
          grep -n "applicationId" android/app/build.gradle.kts

          if ! grep -q 'namespace = "com.digital24online"' android/app/build.gradle.kts; then
            echo "ERROR: namespace mismatch"
            exit 1
          fi

          if ! grep -q 'applicationId = "com.digital24online"' android/app/build.gradle.kts; then
            echo "ERROR: applicationId mismatch"
            exit 1
          fi

          echo "Package verification: OK"

      - name: Verify Firebase configuration
        working-directory: build_test
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("android/app/google-services.json")

          if not path.exists():
              raise SystemExit(
                  "ERROR: google-services.json not found"
              )

          data = json.loads(path.read_text())

          packages = []

          for client in data.get("client", []):
              package = (
                  client
                  .get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              if package:
                  packages.append(package)

          print("Firebase packages:")

          for package in packages:
              print(" -", package)

          if "com.digital24online" not in packages:
              raise SystemExit(
                  "ERROR: com.digital24online is not in Firebase configuration"
              )

          print("Firebase verification: OK")
          PY

      - name: Verify launcher icon source
        working-directory: build_test
        run: |
          if [ ! -f assets/logo.png ]; then
            echo "ERROR: assets/logo.png not found"
            exit 1
          fi

          echo "Launcher icon source found:"
          ls -lh assets/logo.png

      - name: Generate launcher icon
        working-directory: build_test
        run: |
          dart pub global activate flutter_launcher_icons 0.14.4
          dart pub global run flutter_launcher_icons

      - name: Verify launcher icon output
        working-directory: build_test
        run: |
          echo "===== Launcher Resources ====="

          find android/app/src/main/res \
            -type f \
            \( -name "*.png" -o -name "*.xml" \) \
            | sort

          if [ ! -d android/app/src/main/res ]; then
            echo "ERROR: Android resources directory missing"
            exit 1
          fi

          echo "Launcher resource verification: OK"

      - name: Get dependencies
        working-directory: build_test
        run: |
          flutter pub get

      - name: Check Dart code
        working-directory: build_test
        run: |
          flutter analyze lib/main.dart || true

      - name: Build Test-16 Release APK
        working-directory: build_test
        run: |
          flutter build apk \
            --release \
            --target=lib/main.dart

      - name: Verify APK
        run: |
          test -s build_test/build/app/outputs/flutter-apk/app-release.apk

          echo "Test-16 APK created successfully."

      - name: Upload Test-16 APK
        uses: actions/upload-artifact@v4
        with:
          name: Digital24Online-Test16-Release-Firebase-Icon-APK
          path: build_test/build/app/outputs/flutter-apk/app-release.apk
