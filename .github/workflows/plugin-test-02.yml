name: Plugin Test 02 - SQLite

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create test project
        run: |
          flutter create \
            --platforms=android \
            --project-name=digital24test02 \
            --org=com.digital24test02 \
            test_app

      - name: Add SQLite packages
        working-directory: test_app
        run: |
          flutter pub add sqflite
          flutter pub add path

      - name: Create SQLite test
        working-directory: test_app
        run: |
          cat > lib/main.dart <<'EOF'
          import 'package:flutter/material.dart';
          import 'package:path/path.dart';
          import 'package:sqflite/sqflite.dart';

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();

            String result = 'SQLite test started';

            try {
              final databasesPath = await getDatabasesPath();
              final dbPath = join(
                databasesPath,
                'digital24_test.db',
              );

              final db = await openDatabase(
                dbPath,
                version: 1,
                onCreate: (database, version) async {
                  await database.execute(
                    'CREATE TABLE test '
                    '(id INTEGER PRIMARY KEY, name TEXT)',
                  );
                },
              );

              await db.insert(
                'test',
                {'id': 1, 'name': 'Digital 24 Online Billing'},
                conflictAlgorithm: ConflictAlgorithm.replace,
              );

              final rows = await db.query('test');

              result = rows.isNotEmpty
                  ? 'SQLite OK\n${rows.first['name']}'
                  : 'SQLite test failed';

              await db.close();
            } catch (e) {
              result = 'SQLite ERROR\n$e';
            }

            runApp(
              MaterialApp(
                debugShowCheckedModeBanner: false,
                home: Scaffold(
                  body: Center(
                    child: Text(
                      result,
                      textAlign: TextAlign.center,
                      style: const TextStyle(fontSize: 22),
                    ),
                  ),
                ),
              ),
            );
          }
          EOF

      - name: Build APK
        working-directory: test_app
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Verify APK
        working-directory: test_app
        run: |
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Prepare Artifact
        run: |
          mkdir -p artifact
          cp test_app/build/app/outputs/flutter-apk/app-debug.apk \
            artifact/Digital24-Test02-SQLite.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Digital24-Test02-SQLite
          path: artifact/Digital24-Test02-SQLite.apk
          if-no-files-found: error
          retention-days: 7
