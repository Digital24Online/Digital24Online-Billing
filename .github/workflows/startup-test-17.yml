name: Test-17 Firebase Core Runtime

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create clean Flutter project
        run: |
          flutter create \
            --platforms=android \
            --project-name=digital24firebase17 \
            --org=com.digital24online \
            build_test

      - name: Copy Firebase configuration
        run: |
          cp lib/firebase_options.dart build_test/lib/firebase_options.dart

          if [ -f android/app/google-services.json ]; then
            mkdir -p build_test/android/app
            cp android/app/google-services.json \
              build_test/android/app/google-services.json
          else
            echo "ERROR: google-services.json not found"
            exit 1
          fi

      - name: Create Test-17 application
        run: |
          cat > build_test/lib/main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:firebase_core/firebase_core.dart';

          import 'firebase_options.dart';

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();

            String status = 'Starting Firebase...';

            try {
              await Firebase.initializeApp(
                options: DefaultFirebaseOptions.currentPlatform,
              );

              status = 'FIREBASE INITIALIZATION OK';
            } catch (e) {
              status = 'FIREBASE ERROR:\n$e';
            }

            runApp(
              Test17App(status: status),
            );
          }

          class Test17App extends StatelessWidget {
            final String status;

            const Test17App({
              super.key,
              required this.status,
            });

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                home: Scaffold(
                  appBar: AppBar(
                    title: const Text('Test-17'),
                  ),
                  body: Center(
                    child: Padding(
                      padding: const EdgeInsets.all(24),
                      child: Text(
                        status,
                        textAlign: TextAlign.center,
                        style: const TextStyle(
                          fontSize: 20,
                          fontWeight: FontWeight.bold,
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }
          }
          DART

      - name: Force correct Android package
        working-directory: build_test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          text = p.read_text()

          text = re.sub(
              r'namespace\s*=\s*"[^"]+"',
              'namespace = "com.digital24online"',
              text
          )

          text = re.sub(
              r'applicationId\s*=\s*"[^"]+"',
              'applicationId = "com.digital24online"',
              text
          )

          p.write_text(text)
          PY

      - name: Configure Firebase and Android build
        working-directory: build_test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # settings.gradle.kts
          p = Path("android/settings.gradle.kts")
          text = p.read_text()

          text = re.sub(
              r'id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+"[^"]+"\s+apply\s+false',
              'id("org.jetbrains.kotlin.android") version "2.3.21" apply false',
              text
          )

          if 'com.google.gms.google-services' not in text:
              text = text.replace(
                  'plugins {',
                  '''plugins {
              id("com.google.gms.google-services") version "4.4.4" apply false
              ''',
                  1
              )

          p.write_text(text)

          # app/build.gradle.kts
          p = Path("android/app/build.gradle.kts")
          text = p.read_text()

          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(
                  'plugins {',
                  '''plugins {
              id("com.google.gms.google-services")
              ''',
                  1
              )

          text = re.sub(
              r'sourceCompatibility\s*=\s*JavaVersion\.VERSION_\d+',
              'sourceCompatibility = JavaVersion.VERSION_17',
              text
          )

          text = re.sub(
              r'targetCompatibility\s*=\s*JavaVersion\.VERSION_\d+',
              'targetCompatibility = JavaVersion.VERSION_17',
              text
          )

          text = re.sub(
              r'\n\s*kotlinOptions\s*\{.*?\n\s*\}',
              '',
              text,
              flags=re.DOTALL
          )

          text = re.sub(
              r'\n\s*kotlin\s*\{\s*compilerOptions\s*\{.*?\n\s*\}\s*\}',
              '',
              text,
              flags=re.DOTALL
          )

          marker = 'android {'

          replacement = '''android {
              kotlin {
                  compilerOptions {
                      jvmTarget.set(
                          org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                      )
                  }
              }
          '''

          text = text.replace(marker, replacement, 1)

          p.write_text(text)
          PY

      - name: Verify package and Firebase files
        working-directory: build_test
        run: |
          echo "===== Android Package ====="
          grep -n "namespace" android/app/build.gradle.kts
          grep -n "applicationId" android/app/build.gradle.kts

          echo "===== Firebase Options ====="
          test -s lib/firebase_options.dart

          echo "===== Google Services ====="
          test -s android/app/google-services.json

          echo "All required Firebase files exist."

          if ! grep -q 'namespace = "com.digital24online"' android/app/build.gradle.kts; then
            echo "ERROR: namespace mismatch"
            exit 1
          fi

          if ! grep -q 'applicationId = "com.digital24online"' android/app/build.gradle.kts; then
            echo "ERROR: applicationId mismatch"
            exit 1
          fi

      - name: Verify Firebase package
        working-directory: build_test
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("android/app/google-services.json").read_text()
          )

          packages = []

          for client in data.get("client", []):
              package = (
                  client
                  .get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
              )

              if package:
                  packages.append(package)

          print("Firebase packages:")

          for package in packages:
              print(" -", package)

          if "com.digital24online" not in packages:
              raise SystemExit(
                  "ERROR: com.digital24online not found"
              )

          print("Firebase package verification: OK")
          PY

      - name: Add Firebase Core
        working-directory: build_test
        run: |
          flutter pub add firebase_core:^4.5.0

      - name: Get dependencies
        working-directory: build_test
        run: |
          flutter pub get

      - name: Analyze Test-17
        working-directory: build_test
        run: |
          flutter analyze lib/main.dart

      - name: Build Test-17 Release APK
        working-directory: build_test
        run: |
          flutter build apk \
            --release \
            --target=lib/main.dart

      - name: Verify APK
        run: |
          test -s build_test/build/app/outputs/flutter-apk/app-release.apk
          echo "Test-17 APK created successfully."

      - name: Upload Test-17 APK
        uses: actions/upload-artifact@v4
        with:
          name: Digital24Online-Test17-Firebase-Core-APK
          path: build_test/build/app/outputs/flutter-apk/app-release.apk
