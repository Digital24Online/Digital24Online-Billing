name: Plugin Test 11 - Firebase Full Initialization

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create clean Flutter project
        run: |
          flutter create \
            --org com.digital24online \
            --project-name digital24online \
            --platforms android \
            firebase_full_test

      - name: Add Firebase packages
        working-directory: firebase_full_test
        run: |
          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore

      - name: Copy Firebase configuration
        run: |
          cp android/app/google-services.json \
             firebase_full_test/android/app/google-services.json

      - name: Configure Android
        working-directory: firebase_full_test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # settings.gradle.kts
          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()

          text = text.replace(
              'id("org.jetbrains.kotlin.android") version "2.1.0" apply false',
              'id("org.jetbrains.kotlin.android") version "2.3.21" apply false'
          )

          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(
                  'id("dev.flutter.flutter-plugin-loader") version "1.0.0"',
                  'id("dev.flutter.flutter-plugin-loader") version "1.0.0"\n'
                  '    id("com.google.gms.google-services") version "4.4.4" apply false'
              )

          settings.write_text(text)

          # app/build.gradle.kts
          app = Path("android/app/build.gradle.kts")
          text = app.read_text()

          text = text.replace(
              'applicationId = "com.digital24online.digital24online"',
              'applicationId = "com.digital24online"'
          )

          text = text.replace(
              'namespace = "com.digital24online.digital24online"',
              'namespace = "com.digital24online"'
          )

          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(
                  'id("dev.flutter.flutter-gradle-plugin")',
                  'id("dev.flutter.flutter-gradle-plugin")\n'
                  '    id("com.google.gms.google-services")'
              )

          # Force Java 17
          if "compileOptions {" in text:
              start = text.index("compileOptions {")
              end = text.index("}", start) + 1
              text = (
                  text[:start]
                  + """compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }"""
                  + text[end:]
              )
          else:
              text += """
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          """

          # Remove any old kotlinOptions block
          while "kotlinOptions {" in text:
              start = text.index("kotlinOptions {")
              brace = text.index("{", start)
              depth = 0
              end = brace

              for i in range(brace, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              text = text[:start] + text[end:]

          # Remove old compilerOptions/kotlin block if present
          while "kotlin {" in text:
              start = text.index("kotlin {")
              brace = text.index("{", start)
              depth = 0
              end = brace

              for i in range(brace, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              text = text[:start] + text[end:]

          # Import MUST be at the very beginning
          import_line = "import org.jetbrains.kotlin.gradle.dsl.JvmTarget"

          if text.startswith(import_line):
              pass
          else:
              text = import_line + "\n\n" + text

          # Kotlin 17
          text += """

          kotlin {
              jvmToolchain(17)

              compilerOptions {
                  jvmTarget.set(JvmTarget.JVM_17)
              }
          }
          """

          app.write_text(text)

          print("Android configuration completed.")
          PY

      - name: Verify JVM configuration
        working-directory: firebase_full_test
        run: |
          echo "===== JAVA ====="
          java -version

          echo "===== KOTLIN ====="
          grep -n "kotlin.android" android/settings.gradle.kts || true

          echo "===== JAVA 17 CONFIG ====="
          grep -n -A4 "compileOptions" android/app/build.gradle.kts || true

          echo "===== KOTLIN JVM TOOLCHAIN ====="
          grep -n -A8 "kotlin {" android/app/build.gradle.kts || true

          echo "===== APPLICATION ID ====="
          grep -n "applicationId" android/app/build.gradle.kts || true

          echo "===== FIREBASE PLUGIN ====="
          grep -n "google-services" \
            android/settings.gradle.kts \
            android/app/build.gradle.kts || true

      - name: Replace test main.dart
        working-directory: firebase_full_test
        run: |
          cat > lib/main.dart <<'EOF'
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:firebase_auth/firebase_auth.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:flutter/material.dart';

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();

            String result;

            try {
              final app = await Firebase.initializeApp();

              final auth = FirebaseAuth.instance;
              final firestore = FirebaseFirestore.instance;

              result =
                  'Firebase Full Initialization OK\n\n'
                  'App: ${app.name}\n'
                  'Project: ${app.options.projectId}\n'
                  'App ID: ${app.options.appId}\n'
                  'Auth: ${auth.app.name == app.name ? "OK" : "ERROR"}\n'
                  'Firestore: ${firestore.app.name == app.name ? "OK" : "ERROR"}';
            } catch (e) {
              result =
                  'Firebase Full Initialization ERROR\n\n$e';
            }

            runApp(
              MaterialApp(
                debugShowCheckedModeBanner: false,
                home: Scaffold(
                  appBar: AppBar(
                    title: const Text('Firebase Test 11'),
                  ),
                  body: Center(
                    child: Padding(
                      padding: const EdgeInsets.all(20),
                      child: SelectableText(
                        result,
                        textAlign: TextAlign.center,
                        style: const TextStyle(fontSize: 17),
                      ),
                    ),
                  ),
                ),
              ),
            );
          }
          EOF

      - name: Get dependencies
        working-directory: firebase_full_test
        run: |
          flutter pub get

      - name: Build APK
        working-directory: firebase_full_test
        run: |
          flutter build apk --debug

      - name: Prepare APK
        run: |
          mkdir -p artifact

          cp firebase_full_test/build/app/outputs/flutter-apk/app-debug.apk \
             artifact/Firebase-Full-Test-11.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Firebase-Full-Test-11-APK
          path: artifact/Firebase-Full-Test-11.apk
