name: Plugin Test 11 - Firebase Full Initialization

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create clean Flutter project
        run: |
          flutter create \
            --org com.digital24online \
            --project-name digital24online \
            --platforms android \
            firebase_full_test

      - name: Add Firebase dependencies
        working-directory: firebase_full_test
        run: |
          flutter pub add firebase_core
          flutter pub add firebase_auth
          flutter pub add cloud_firestore

      - name: Copy Firebase configuration
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "ERROR: android/app/google-services.json not found."
            exit 1
          fi

          cp android/app/google-services.json \
             firebase_full_test/android/app/google-services.json

      - name: Configure Android
        working-directory: firebase_full_test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # -------------------------------------------------
          # settings.gradle.kts
          # -------------------------------------------------
          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()

          text = text.replace(
              'id("org.jetbrains.kotlin.android") version "2.1.0" apply false',
              'id("org.jetbrains.kotlin.android") version "2.3.21" apply false'
          )

          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(
                  'id("dev.flutter.flutter-plugin-loader") version "1.0.0"',
                  'id("dev.flutter.flutter-plugin-loader") version "1.0.0"\n'
                  '    id("com.google.gms.google-services") version "4.4.4" apply false'
              )

          settings.write_text(text)

          # -------------------------------------------------
          # app/build.gradle.kts
          # -------------------------------------------------
          app = Path("android/app/build.gradle.kts")
          text = app.read_text()

          # Correct Firebase package
          text = text.replace(
              'applicationId = "com.digital24online.digital24online"',
              'applicationId = "com.digital24online"'
          )

          text = text.replace(
              'namespace = "com.digital24online.digital24online"',
              'namespace = "com.digital24online"'
          )

          # Add Google Services plugin
          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(
                  'id("dev.flutter.flutter-gradle-plugin")',
                  'id("dev.flutter.flutter-gradle-plugin")\n'
                  '    id("com.google.gms.google-services")'
              )

          # Remove old kotlinOptions block completely
          lines = text.splitlines()
          cleaned = []
          skip = False
          depth = 0

          for line in lines:
              stripped = line.strip()

              if stripped.startswith("kotlinOptions {"):
                  skip = True
                  depth = 1
                  continue

              if skip:
                  depth += line.count("{")
                  depth -= line.count("}")

                  if depth <= 0:
                      skip = False

                  continue

              cleaned.append(line)

          text = "\n".join(cleaned) + "\n"

          # -------------------------------------------------
          # IMPORTANT:
          # Import MUST be at the top of the Kotlin script.
          # -------------------------------------------------
          import_line = "import org.jetbrains.kotlin.gradle.dsl.JvmTarget"

          if import_line not in text:
              text = import_line + "\n\n" + text

          # -------------------------------------------------
          # Kotlin 2.3 compilerOptions
          # -------------------------------------------------
          if "compilerOptions {" not in text:
              text += """
          kotlin {
              compilerOptions {
                  jvmTarget.set(JvmTarget.JVM_17)
              }
          }
          """

          app.write_text(text)
          PY

      - name: Verify Android configuration
        working-directory: firebase_full_test
        run: |
          echo "===== Google Services package ====="
          grep -o '"package_name": "[^"]*"' \
            android/app/google-services.json || true

          echo "===== Kotlin plugin ====="
          grep -n "kotlin.android" \
            android/settings.gradle.kts || true

          echo "===== Google Services plugin ====="
          grep -n "google-services" \
            android/settings.gradle.kts \
            android/app/build.gradle.kts || true

          echo "===== Compiler Options ====="
          grep -n -A6 "compilerOptions" \
            android/app/build.gradle.kts || true

          echo "===== Application ID ====="
          grep -n "applicationId" \
            android/app/build.gradle.kts || true

          echo "===== Namespace ====="
          grep -n "namespace" \
            android/app/build.gradle.kts || true

      - name: Replace test main.dart
        working-directory: firebase_full_test
        run: |
          cat > lib/main.dart <<'EOF'
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:firebase_auth/firebase_auth.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:flutter/material.dart';

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();

            String result;

            try {
              final app = await Firebase.initializeApp();

              final auth = FirebaseAuth.instance;
              final firestore = FirebaseFirestore.instance;

              result =
                  'Firebase Full Initialization OK\n\n'
                  'App name: ${app.name}\n'
                  'App ID: ${app.options.appId}\n'
                  'Project ID: ${app.options.projectId}\n'
                  'Auth initialized: '
                  '${auth.app.name == app.name}\n'
                  'Firestore initialized: '
                  '${firestore.app.name == app.name}';
            } catch (e) {
              result =
                  'Firebase Full Initialization ERROR\n\n'
                  '$e';
            }

            runApp(
              MaterialApp(
                debugShowCheckedModeBanner: false,
                home: Scaffold(
                  appBar: AppBar(
                    title: const Text('Firebase Test 11'),
                  ),
                  body: Center(
                    child: Padding(
                      padding: const EdgeInsets.all(20),
                      child: SelectableText(
                        result,
                        textAlign: TextAlign.center,
                        style: const TextStyle(fontSize: 17),
                      ),
                    ),
                  ),
                ),
              ),
            );
          }
          EOF

      - name: Get dependencies
        working-directory: firebase_full_test
        run: |
          flutter pub get

      - name: Build APK
        working-directory: firebase_full_test
        run: |
          flutter build apk --debug

      - name: Prepare APK
        run: |
          mkdir -p artifact

          cp firebase_full_test/build/app/outputs/flutter-apk/app-debug.apk \
             artifact/Firebase-Full-Test-11.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Firebase-Full-Test-11-APK
          path: artifact/Firebase-Full-Test-11.apk
