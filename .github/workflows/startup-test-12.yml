      - name: Configure Kotlin and Android
        working-directory: build_test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # settings.gradle.kts
          p = Path("android/settings.gradle.kts")
          text = p.read_text()

          text = text.replace(
              'id("org.jetbrains.kotlin.android") version "2.1.0" apply false',
              'id("org.jetbrains.kotlin.android") version "2.3.21" apply false'
          )

          p.write_text(text)

          # app/build.gradle.kts
          p = Path("android/app/build.gradle.kts")
          text = p.read_text()

          # Remove old Kotlin jvmTarget configuration
          text = re.sub(
              r'\n\s*kotlinOptions\s*\{.*?\n\s*\}',
              '',
              text,
              flags=re.DOTALL
          )

          # Add Java 17 configuration if missing
          if 'compileOptions {' not in text:
              text = text.replace(
                  'android {',
                  '''android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              ''',
                  1
              )

          # Add modern Kotlin compilerOptions configuration
          if 'compilerOptions {' not in text:
              text = text.replace(
                  'android {',
                  '''android {
              kotlin {
                  compilerOptions {
                      jvmTarget.set(
                          org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                      )
                  }
              }
              ''',
                  1
              )

          p.write_text(text)
          PY
