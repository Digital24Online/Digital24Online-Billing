name: Test-12 Startup Isolation

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create clean Android project
        run: |
          flutter create \
            --platforms=android \
            --project-name=digital24startup12 \
            --org=com.digital24online \
            build_test

      - name: Copy current project files
        run: |
          rm -rf build_test/lib
          cp -R lib build_test/lib
          cp pubspec.yaml build_test/pubspec.yaml

          if [ -d assets ]; then
            cp -R assets build_test/assets
          fi

          if [ -f android/app/google-services.json ]; then
            mkdir -p build_test/android/app
            cp android/app/google-services.json \
              build_test/android/app/google-services.json
          fi

      - name: Replace main.dart with Startup Test 12
        working-directory: build_test
        run: |
          cat > lib/startup_test_12.dart <<'DART'
          import 'package:flutter/material.dart';

          import 'main.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();

            runApp(
              const MaterialApp(
                debugShowCheckedModeBanner: false,
                home: Scaffold(
                  body: Center(
                    child: Text(
                      'TEST-12 STARTUP OK',
                      style: TextStyle(
                        fontSize: 28,
                        fontWeight: FontWeight.bold,
                      ),
                    ),
                  ),
                ),
              ),
            );
          }
          DART

      - name: Get dependencies
        working-directory: build_test
        run: |
          flutter pub get

      - name: Configure Android Java and Kotlin
        working-directory: build_test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          text = p.read_text()

          if 'compileOptions {' not in text:
              text = text.replace(
                  'android {',
                  '''android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
              ''',
                  1
              )

          p.write_text(text)
          PY

      - name: Build Test-12 APK
        working-directory: build_test
        run: |
          flutter build apk \
            --debug \
            --target=lib/startup_test_12.dart

      - name: Verify APK exists
        run: |
          test -s build_test/build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Test-12 APK
        uses: actions/upload-artifact@v4
        with:
          name: Digital24Online-Test12-APK
          path: build_test/build/app/outputs/flutter-apk/app-debug.apk
